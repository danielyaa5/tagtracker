name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build and test
        run: make build test
      - name: Prepare native app dependencies
        run: |
          command -v xcodegen || brew install xcodegen
          python3 release/prepare.py
      - name: Build native app without distribution credentials
        run: xcodebuild -project TagTracker.xcodeproj -scheme TagTracker -configuration Release -derivedDataPath .tools/ci-build CODE_SIGNING_ALLOWED=NO build -quiet
