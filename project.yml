name: TagTracker
options:
  bundleIdPrefix: io.tagtracker
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TagTracker:
    type: application
    platform: macOS
    sources:
      - path: app
        excludes: [Info.plist]
      - path: .tools/payload/runtime
        type: folder
        buildPhase: resources
    dependencies:
      - framework: .tools/sparkle/Sparkle.framework
        embed: true
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: TagTracker
        CFBundleIconFile: TagTracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.utilities
        NSAppleEventsUsageDescription: TagTracker controls Find My to collect the observations you selected.
        NSScreenCaptureUsageDescription: TagTracker reads the places displayed in Find My.
        SUFeedURL: https://danielyaa5.github.io/tagtracker/appcast.xml
        SUPublicEDKey: BlNgXZpk9KrF3VwnpHnHoJFPiifOtG4ygVlY0UyCEjU=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUSendProfileInfo: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tagtracker.app
        PRODUCT_NAME: TagTracker
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
    postBuildScripts:
      - name: Sign bundled runtime
        script: python3 release/sign-runtime.py "$CODESIGNING_FOLDER_PATH/Contents/Resources/runtime" "$EXPANDED_CODE_SIGN_IDENTITY"
        basedOnDependencyAnalysis: false
